name: Bug report
description: Report a reproducible problem with Bots
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Before reporting, update to the latest Bots image and remove secrets and private URLs from logs.
  - type: input
    id: unraid
    attributes:
      label: Unraid OS version
      placeholder: 7.3.2
    validations:
      required: true
  - type: dropdown
    id: monitor
    attributes:
      label: Monitor type
      options:
        - Product
        - HTTP website
        - TCP server
        - Notifications
        - Installation or update
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain what you expected and what occurred instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Select…\n3. See error…"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials, email addresses, tokens, and private URLs.
      render: shell
